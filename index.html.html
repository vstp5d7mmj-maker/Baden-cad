<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Baden CAD</title>
<style>
:root {
  color-scheme: dark;
  --bg:#111827; --panel:#1f2937; --line:#374151;
  --accent:#38bdf8; --text:#f9fafb; --muted:#9ca3af;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; margin:0; overflow:hidden; font-family:system-ui,sans-serif; }
body { background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
header {
  height:54px; display:flex; align-items:center; gap:8px;
  padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line);
}
.brand { font-weight:750; white-space:nowrap; margin-right:4px; }
.toolbar { display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; }
button {
  border:1px solid var(--line); background:#111827; color:var(--text);
  border-radius:9px; min-height:40px; padding:7px 11px;
  font-size:14px; font-weight:600; white-space:nowrap;
}
button.active { background:var(--accent); color:#062438; border-color:var(--accent); }
button:disabled { opacity:.4; }
.workspace { position:relative; flex:1; min-height:0; background:#f8fafc; }
canvas { width:100%; height:100%; display:block; touch-action:none; }
.measure {
  position:absolute; left:10px; bottom:10px; display:flex; gap:6px;
  padding:7px; border-radius:11px; background:rgba(17,24,39,.92);
}
.measure input {
  width:88px; min-height:38px; border:1px solid var(--line);
  border-radius:8px; background:#fff; color:#111827; padding:6px 8px;
  font-size:16px;
}
.status {
  height:30px; display:flex; align-items:center; justify-content:space-between;
  padding:0 10px; background:var(--panel); color:var(--muted); font-size:12px;
}
#fileInput { display:none; }
@media(max-width:700px) {
  .brand { font-size:14px; }
  header { height:58px; }
  button { min-height:44px; }
  .status span:first-child { max-width:70%; overflow:hidden; text-overflow:ellipsis; }
}

header { height:44px; }
.toolbar { position:absolute; top:44px; bottom:30px; left:0; width:62px; flex-direction:column; overflow-y:auto; overflow-x:hidden; padding:7px; background:var(--panel); z-index:2; border-right:1px solid var(--line); }
.toolbar button { flex-shrink:0; width:46px; height:44px; padding:9px; }
.toolbar svg { width:24px; height:24px; display:block; margin:auto; }
.workspace { margin-left:62px; }
.measure { flex-wrap:wrap; max-width:calc(100% - 20px); }
@media(max-width:700px) { header { height:44px; } .status { font-size:10px; } }
</style>
</head>
<body>
<header>
  <div class="brand">Baden CAD</div>
  <div class="toolbar">
    <button data-tool="select" class="active">Auswahl</button>
    <button data-tool="line">Linie</button>
<button data-tool="polyline">Polylinie</button>
<button data-tool="quad">Viereckige Fläche</button>
<button id="ortho" aria-pressed="false">Orthogonal</button>
<button id="finishPath">Zeichnung abschließen</button>
    <button data-tool="rect">Rechteck</button>
    <button data-tool="circle">Kreis</button>
    <button data-tool="pan">Verschieben</button>
    <button id="undo">↶</button>
    <button id="redo">↷</button>
    <button id="delete">Löschen</button>
    <button id="save">Speichern</button>
    <button id="exportProject">Projekt ↓</button>
    <button id="importProject">Projekt ↑</button>
    <button id="exportSvg">SVG ↓</button>
    <button id="newProject">Neu</button>
  </div>
</header>
<div class="workspace">
  <canvas id="cad"></canvas>
  <div class="measure">
    <input id="measureA" type="number" inputmode="decimal" min="0" step="1" placeholder="Maß A cm">
    <input id="measureB" type="number" inputmode="decimal" min="0" step="1" placeholder="Maß B cm">
    <button id="applyMeasure">Setzen</button>
  </div>
</div>
<div class="status">
  <span id="message">Werkzeug: Auswahl</span>
  <span id="coordinates">X 0 cm · Y 0 cm</span>
</div>
<input id="fileInput" type="file" accept=".json,.badencad,application/json">
<script>
(() => {
  "use strict";
  const canvas = document.querySelector("#cad");
  const ctx = canvas.getContext("2d");
  const message = document.querySelector("#message");
  const coordinates = document.querySelector("#coordinates");
  const measureA = document.querySelector("#measureA");
  const measureB = document.querySelector("#measureB");
  const fileInput = document.querySelector("#fileInput");
  let shapes = [];
  let selected = -1;
  let tool = "select";
  let preview = null;
  let pathPoints = [];
  let ortho = false;
  let action = null;
  let undoStack = [];
  let redoStack = [];
  let scale = 3;
  let offset = { x: 100, y: 100 };
  const snapSize = 10;
  const pointers = new Map();
  let pinch = null;
  let gestureActive = false;
  const clone = value => JSON.parse(JSON.stringify(value));
  const distance = (a,b) => Math.hypot(b.x-a.x,b.y-a.y);
  const snap = p => ({
    x: Math.round(p.x/snapSize)*snapSize,
    y: Math.round(p.y/snapSize)*snapSize
  });
  function screenToWorld(x,y) {
    const r = canvas.getBoundingClientRect();
    return { x:(x-r.left-offset.x)/scale, y:(y-r.top-offset.y)/scale };
  }
  function worldToScreen(p) {
    return { x:p.x*scale+offset.x, y:p.y*scale+offset.y };
  }
  function setMessage(text) { message.textContent = text; }
  function resize() {
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const r = canvas.getBoundingClientRect();
    canvas.width = Math.round(r.width*dpr);
    canvas.height = Math.round(r.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    draw();
  }
  function remember(snapshot = JSON.stringify(shapes)) {
    undoStack.push(snapshot);
    if (undoStack.length > 100) undoStack.shift();
    redoStack = [];
  }
  function changed() {
    localStorage.setItem("baden-cad-project", JSON.stringify({
      version:1, unit:"cm", shapes
    }));
    updateButtons();
    draw();
  }
  function updateButtons() {
    document.querySelector("#undo").disabled = !undoStack.length && !pathPoints.length;
    document.querySelector("#redo").disabled = !redoStack.length;
    document.querySelector("#delete").disabled = selected < 0;
  }
  function setTool(name) {
    tool = name;
    selected = name === "select" ? selected : -1;
    preview = null;
    pathPoints = [];
    action = null;
    document.querySelectorAll("[data-tool]").forEach(button =>
      button.classList.toggle("active", button.dataset.tool === name)
    );
    const names = {
      select:"Auswahl", line:"Linie", rect:"Rechteck",
      circle:"Kreis", pan:"Ansicht verschieben", polyline:"Polylinie · Anfangspunkt antippen zum Schließen", quad:"Viereckige Fläche · 4 Eckpunkte setzen"
    };
    setMessage("Werkzeug: " + names[name]);
    updateMeasureFields();
    updateButtons();
    draw();
  }
  function updateMeasureFields() {
    measureA.value = "";
    measureB.value = "";
    if (selected < 0 || !shapes[selected]) return;
    const s = shapes[selected];
    if (s.type === "line") measureA.value = distance(s.a,s.b).toFixed(1);
    if (s.type === "rect") {
      measureA.value = Math.abs(s.b.x-s.a.x).toFixed(1);
      measureB.value = Math.abs(s.b.y-s.a.y).toFixed(1);
    }
    if (s.type === "circle") measureA.value = s.r.toFixed(1);
  }
  function drawGrid(width,height) {
    ctx.fillStyle = "#f8fafc";
    ctx.fillRect(0,0,width,height);
    let step = snapSize;
    while (step*scale < 18) step *= 2;
    while (step*scale > 70) step /= 2;
    const left = -offset.x/scale;
    const top = -offset.y/scale;
    const right = (width-offset.x)/scale;
    const bottom = (height-offset.y)/scale;
    ctx.lineWidth = 1;
    for (let x=Math.floor(left/step)*step; x<=right; x+=step) {
      const sx = x*scale+offset.x;
      const major = Math.round(x/step)%5 === 0;
      ctx.strokeStyle = major ? "#cbd5e1" : "#e5e7eb";
      ctx.beginPath(); ctx.moveTo(sx,0); ctx.lineTo(sx,height); ctx.stroke();
    }
    for (let y=Math.floor(top/step)*step; y<=bottom; y+=step) {
      const sy = y*scale+offset.y;
      const major = Math.round(y/step)%5 === 0;
      ctx.strokeStyle = major ? "#cbd5e1" : "#e5e7eb";
      ctx.beginPath(); ctx.moveTo(0,sy); ctx.lineTo(width,sy); ctx.stroke();
    }
    const origin = worldToScreen({x:0,y:0});
    ctx.strokeStyle = "#94a3b8";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(origin.x,0); ctx.lineTo(origin.x,height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,origin.y); ctx.lineTo(width,origin.y); ctx.stroke();
  }
  function label(text,p) {
    const q = worldToScreen(p);
    ctx.font = "12px system-ui";
    const w = ctx.measureText(text).width+10;
    ctx.fillStyle = "rgba(15,23,42,.82)";
    ctx.fillRect(q.x-w/2,q.y-22,w,18);
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.fillText(text,q.x,q.y-9);
  }
  function drawShape(s,isSelected=false,isPreview=false) {
    ctx.save();
    ctx.strokeStyle = isSelected ? "#0284c7" : isPreview ? "#f59e0b" : "#111827";
    ctx.fillStyle = isSelected ? "rgba(56,189,248,.10)" : "rgba(15,23,42,.035)";
    ctx.lineWidth = isSelected ? 3 : 2;
    ctx.setLineDash(isPreview ? [7,5] : []);
    if (s.type === "line") {
      const a=worldToScreen(s.a), b=worldToScreen(s.b);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      label(distance(s.a,s.b).toFixed(1)+" cm",
        {x:(s.a.x+s.b.x)/2,y:(s.a.y+s.b.y)/2});
    }
    if (s.type === "rect") {
      const a=worldToScreen(s.a), b=worldToScreen(s.b);
      ctx.beginPath();
      ctx.rect(a.x,a.y,b.x-a.x,b.y-a.y);
      ctx.fill(); ctx.stroke();
      label(
        Math.abs(s.b.x-s.a.x).toFixed(1)+" × "+
        Math.abs(s.b.y-s.a.y).toFixed(1)+" cm",
        {x:(s.a.x+s.b.x)/2,y:(s.a.y+s.b.y)/2}
      );
    }
    if (s.type === "polyline" || s.type === "polygon") {
      if (s.points.length) {
        ctx.beginPath();
        s.points.forEach((p,i)=>{const q=worldToScreen(p); i ? ctx.lineTo(q.x,q.y) : ctx.moveTo(q.x,q.y);});
        if (s.closed) { ctx.closePath(); ctx.fill(); }
        ctx.stroke();
        if (isSelected || isPreview) s.points.forEach(p=>{
          const q=worldToScreen(p);ctx.beginPath();ctx.arc(q.x,q.y,4,0,Math.PI*2);ctx.fill();
        });
        if (s.closed && !isPreview) {
          const area=Math.abs(s.points.reduce((sum,p,i)=>{const n=s.points[(i+1)%s.points.length];return sum+p.x*n.y-n.x*p.y;},0))/2;
          const center={x:s.points.reduce((v,p)=>v+p.x,0)/s.points.length,y:s.points.reduce((v,p)=>v+p.y,0)/s.points.length};
          label((area/10000).toFixed(2)+" m²",center);
        }
      }
    }
    if (s.type === "circle") {
      const c=worldToScreen(s.c);
      ctx.beginPath(); ctx.arc(c.x,c.y,s.r*scale,0,Math.PI*2);
      ctx.fill(); ctx.stroke();
      label("R "+s.r.toFixed(1)+" cm",{x:s.c.x,y:s.c.y-s.r});
    }
    ctx.restore();
  }
  function draw() {
    const r = canvas.getBoundingClientRect();
    drawGrid(r.width,r.height);
    shapes.forEach((shape,i) => drawShape(shape,i===selected,false));
    if (preview) drawShape(preview,false,true);
    if (pathPoints.length) {
      const q=worldToScreen(pathPoints[0]);
      ctx.strokeStyle="#0284c7";ctx.lineWidth=2;ctx.beginPath();ctx.arc(q.x,q.y,12,0,Math.PI*2);ctx.stroke();
    }
  }
  function segmentDistance(p,a,b) {
    const dx=b.x-a.x, dy=b.y-a.y;
    const l2=dx*dx+dy*dy;
    if (!l2) return distance(p,a);
    const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l2));
    return distance(p,{x:a.x+t*dx,y:a.y+t*dy});
  }
  function hitTest(p) {
    const tolerance = 14/scale;
    for (let i=shapes.length-1;i>=0;i--) {
      const s=shapes[i];
      if (s.type==="polygon" || s.type==="polyline") {
        let inside=false;
        for(let j=0,k=s.points.length-1;j<s.points.length;k=j++){
          const a=s.points[k],b=s.points[j];
          if ((j>0 || s.closed) && segmentDistance(p,a,b)<=tolerance) return i;
          if ((a.y>p.y)!==(b.y>p.y) && p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x) inside=!inside;
        }
        if(s.closed && inside) return i;
      }
      if (s.type==="line" && segmentDistance(p,s.a,s.b)<=tolerance) return i;
      if (s.type==="circle" &&
          (Math.abs(distance(p,s.c)-s.r)<=tolerance || distance(p,s.c)<s.r)) return i;
      if (s.type==="rect") {
        const minX=Math.min(s.a.x,s.b.x)-tolerance;
        const maxX=Math.max(s.a.x,s.b.x)+tolerance;
        const minY=Math.min(s.a.y,s.b.y)-tolerance;
        const maxY=Math.max(s.a.y,s.b.y)+tolerance;
        if (p.x>=minX && p.x<=maxX && p.y>=minY && p.y<=maxY) return i;
      }
    }
    return -1;
  }
  function translateShape(shape,dx,dy) {
    const s=clone(shape);
    if (s.type==="line" || s.type==="rect") {
      s.a.x+=dx; s.a.y+=dy; s.b.x+=dx; s.b.y+=dy;
    } else if (s.points) {
      s.points=s.points.map(p=>({x:p.x+dx,y:p.y+dy}));
    } else {
      s.c.x+=dx; s.c.y+=dy;
    }
    return s;
  }
  function beginPinch() {
    if (pointers.size!==2) return;
    const pts=[...pointers.values()];
    const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
    pinch={
      distance:distance(pts[0],pts[1]),
      scale,
      offset:{...offset},
      mid,
      world:screenToWorld(mid.x,mid.y)
    };
    if(action?.kind==="drag") shapes=JSON.parse(action.snapshot);
    action=null;
    preview=null;
    gestureActive=true;
  }
  canvas.addEventListener("pointerdown", event => {
    canvas.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    if (pointers.size===2) { beginPinch(); return; }
    if (gestureActive) return;
    const raw=screenToWorld(event.clientX,event.clientY);
    const p=snap(raw);
    if (tool==="polyline" || tool==="quad") {
      action={kind:"point",screen:{x:event.clientX,y:event.clientY}};
      return;
    }
    if (tool==="pan") {
      action={kind:"pan",screen:{x:event.clientX,y:event.clientY},offset:{...offset}};
      return;
    }
    if (tool==="select") {
      selected=hitTest(raw);
      if (selected>=0) {
        action={
          kind:"drag",start:p,original:clone(shapes[selected]),
          snapshot:JSON.stringify(shapes),moved:false
        };
      }
      updateMeasureFields(); updateButtons(); draw();
      return;
    }
    action={kind:"draw",start:p};
    if (tool==="line") preview={type:"line",a:p,b:p};
    if (tool==="rect") preview={type:"rect",a:p,b:p};
    if (tool==="circle") preview={type:"circle",c:p,r:0};
    draw();
  });
  canvas.addEventListener("pointermove", event => {
    if (pointers.has(event.pointerId))
      pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
    if (pointers.size===2 && pinch) {
      const pts=[...pointers.values()];
      const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
      const ratio=distance(pts[0],pts[1])/Math.max(1,pinch.distance);
      scale=Math.max(.25,Math.min(30,pinch.scale*ratio));
      const bounds=canvas.getBoundingClientRect();
      offset.x=mid.x-bounds.left-pinch.world.x*scale;
      offset.y=mid.y-bounds.top-pinch.world.y*scale;
      draw();
      return;
    }
    const raw=screenToWorld(event.clientX,event.clientY);
    let p=snap(raw);
    if ((tool==="polyline" || tool==="quad") && pathPoints.length && !gestureActive) {
      p=constrain(p,pathPoints[pathPoints.length-1]);
      preview={type:tool==="quad"?"polygon":"polyline",points:[...pathPoints,p],closed:tool==="quad"};
      draw();
    }
    coordinates.textContent=`X ${p.x.toFixed(0)} cm · Y ${p.y.toFixed(0)} cm`;
    if (!action || gestureActive) return;
    if (action.kind==="pan") {
      offset.x=action.offset.x+event.clientX-action.screen.x;
      offset.y=action.offset.y+event.clientY-action.screen.y;
    }
    if (action.kind==="drag" && selected>=0) {
      const dx=p.x-action.start.x, dy=p.y-action.start.y;
      if (dx || dy) action.moved=true;
      shapes[selected]=translateShape(action.original,dx,dy);
    }
    if (action.kind==="draw" && preview) {
      if (preview.type==="line" || preview.type==="rect") preview.b=preview.type==="line"?constrain(p,preview.a):p;
      if (preview.type==="circle") preview.r=distance(preview.c,p);
    }
    draw();
  });
  function finishPointer(event) {
    pointers.delete(event.pointerId);
    if (pinch) {
      if (pointers.size<2) pinch=null;
      if (pointers.size===0) gestureActive=false;
      return;
    }
    if (gestureActive) {
      if (pointers.size===0) gestureActive=false;
      return;
    }
    if (!action) return;
    if (action.kind==="point") {
      if(distance(action.screen,{x:event.clientX,y:event.clientY})<18) {
        const raw=screenToWorld(event.clientX,event.clientY);
        if(tool==="polyline" && pathPoints.length>=3 && distance(raw,pathPoints[0])*scale<=18) {
          finishPath(true);
        } else {
          const p=constrain(snap(raw),pathPoints[pathPoints.length-1]);
          if(!pathPoints.length || distance(p,pathPoints[pathPoints.length-1])>0) pathPoints.push(p);
          if(tool==="quad" && pathPoints.length===4) finishPath(true);
          else {
            preview={type:tool==="quad"?"polygon":"polyline",points:clone(pathPoints),closed:false};
            setMessage(tool==="quad" ? "Eckpunkt "+pathPoints.length+"/4 · nächsten Punkt setzen" : pathPoints.length+" Punkte · Anfangspunkt zum Schließen antippen");
          }
        }
      }
      action=null;updateButtons();draw();return;
    }
    if (action.kind==="drag" && action.moved) {
      undoStack.push(action.snapshot);
      redoStack=[];
      changed();
    }
    if (action.kind==="draw" && preview) {
      const valid=preview.type==="circle" ? preview.r>0 : distance(preview.a,preview.b)>0;
      if (valid) {
        remember();
        shapes.push(preview);
        selected=shapes.length-1;
        changed();
        setTool("select");
      }
    }
    action=null;
    preview=null;
    draw();
  }
  canvas.addEventListener("pointerup",finishPointer);
  canvas.addEventListener("pointercancel",event=>{
    pointers.delete(event.pointerId);
    if(action?.kind==="drag") shapes=JSON.parse(action.snapshot);
    action=null;preview=null;pinch=null;
    gestureActive=pointers.size>0;draw();
  });
  canvas.addEventListener("wheel",event => {
    event.preventDefault();
    const before=screenToWorld(event.clientX,event.clientY);
    scale=Math.max(.25,Math.min(30,scale*(event.deltaY<0?1.12:.89)));
    const r=canvas.getBoundingClientRect();
    offset.x=event.clientX-r.left-before.x*scale;
    offset.y=event.clientY-r.top-before.y*scale;
    draw();
  },{passive:false});
  document.querySelectorAll("[data-tool]").forEach(button =>
    button.addEventListener("click",()=>setTool(button.dataset.tool))
  );
  document.querySelector("#undo").addEventListener("click",()=>{
    if(pathPoints.length){pathPoints.pop();preview=pathPoints.length?{type:tool==="quad"?"polygon":"polyline",points:clone(pathPoints),closed:false}:null;updateButtons();draw();return;}
    if (!undoStack.length) return;
    redoStack.push(JSON.stringify(shapes));
    shapes=JSON.parse(undoStack.pop());
    selected=-1; changed();
  });
  document.querySelector("#redo").addEventListener("click",()=>{
    if (!redoStack.length) return;
    undoStack.push(JSON.stringify(shapes));
    shapes=JSON.parse(redoStack.pop());
    selected=-1; changed();
  });
  document.querySelector("#delete").addEventListener("click",()=>{
    if (selected<0) return;
    remember(); shapes.splice(selected,1); selected=-1; changed();
  });
  document.querySelector("#applyMeasure").addEventListener("click",()=>{
    if (selected<0) { setMessage("Zuerst ein Objekt auswählen."); return; }
    if (shapes[selected].points) { setMessage("Maße für Linie, Rechteck oder Kreis setzen."); return; }
    const a=parseFloat(measureA.value);
    const b=parseFloat(measureB.value);
    if (!(a>0)) return;
    remember();
    const s=shapes[selected];
    if (s.type==="line") {
      const angle=Math.atan2(s.b.y-s.a.y,s.b.x-s.a.x);
      s.b={x:s.a.x+Math.cos(angle)*a,y:s.a.y+Math.sin(angle)*a};
    }
    if (s.type==="rect") {
      const sx=s.b.x>=s.a.x?1:-1, sy=s.b.y>=s.a.y?1:-1;
      s.b.x=s.a.x+a*sx;
      if (b>0) s.b.y=s.a.y+b*sy;
    }
    if (s.type==="circle") s.r=a;
    changed(); updateMeasureFields();
  });
  document.querySelector("#save").addEventListener("click",()=>{
    changed(); setMessage("Projekt lokal auf diesem iPad gespeichert.");
  });
  document.querySelector("#newProject").addEventListener("click",()=>{
    if (!confirm("Neues Projekt? Die aktuelle Zeichnung wird geleert.")) return;
    setTool("select");remember(); shapes=[]; selected=-1; changed();
  });
  function download(name,type,content) {
    const blob=new Blob([content],{type});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  document.querySelector("#exportProject").addEventListener("click",()=>{
    download("baden-cad.badencad","application/json",
      JSON.stringify({version:1,unit:"cm",shapes},null,2));
  });
  document.querySelector("#importProject").addEventListener("click",()=>fileInput.click());
  fileInput.addEventListener("change",async()=>{
    const file=fileInput.files[0];
    if (!file) return;
    try {
      const data=JSON.parse(await file.text());
      if (!Array.isArray(data.shapes) || !data.shapes.every(validShape)) throw new Error();
      setTool("select");
      remember(); shapes=data.shapes; selected=-1; changed();
      setMessage("Projekt geladen.");
    } catch {
      alert("Diese Projektdatei konnte nicht gelesen werden.");
    }
    fileInput.value="";
  });
  document.querySelector("#exportSvg").addEventListener("click",()=>{
    if (!shapes.length) { alert("Die Zeichnung ist leer."); return; }
    const points=[];
    shapes.forEach(s=>{
      if(s.points) points.push(...s.points);
      if (s.type==="line" || s.type==="rect") points.push(s.a,s.b);
      if (s.type==="circle") {
        points.push({x:s.c.x-s.r,y:s.c.y-s.r},{x:s.c.x+s.r,y:s.c.y+s.r});
      }
    });
    const pad=20;
    const minX=Math.min(...points.map(p=>p.x))-pad;
    const minY=Math.min(...points.map(p=>p.y))-pad;
    const maxX=Math.max(...points.map(p=>p.x))+pad;
    const maxY=Math.max(...points.map(p=>p.y))+pad;
    const width=maxX-minX, height=maxY-minY;
    const elements=shapes.map(s=>{
      if(s.points) return `<${s.closed?"polygon":"polyline"} points="${s.points.map(p=>p.x+","+p.y).join(" ")}" fill="${s.closed?"#e2e8f0":"none"}"/>`;
      if (s.type==="line")
        return `<line x1="${s.a.x}" y1="${s.a.y}" x2="${s.b.x}" y2="${s.b.y}"/>`;
      if (s.type==="rect")
        return `<rect x="${Math.min(s.a.x,s.b.x)}" y="${Math.min(s.a.y,s.b.y)}" width="${Math.abs(s.b.x-s.a.x)}" height="${Math.abs(s.b.y-s.a.y)}"/>`;
      return `<circle cx="${s.c.x}" cy="${s.c.y}" r="${s.r}"/>`;
    }).join("\n");
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${minX} ${minY} ${width} ${height}" width="${width}cm" height="${height}cm">
<g fill="none" stroke="#000" stroke-width="0.3" vector-effect="non-scaling-stroke">
${elements}
</g>
</svg>`;
    download("baden-cad.svg","image/svg+xml",svg);
  });
  window.addEventListener("keydown",event=>{
    if (/INPUT|TEXTAREA/.test(event.target.tagName)) return;
    if(event.key==="Enter" && tool==="polyline") finishPath(false);
    if ((event.metaKey||event.ctrlKey) && event.key.toLowerCase()==="z") {
      event.preventDefault();
      document.querySelector(event.shiftKey?"#redo":"#undo").click();
    }
    if (event.key==="Delete" || event.key==="Backspace")
      document.querySelector("#delete").click();
    if (event.key==="Escape") setTool("select");
  });
  
  function constrain(p,anchor) {
    if(!ortho || !anchor) return p;
    return Math.abs(p.x-anchor.x)>=Math.abs(p.y-anchor.y)?{x:p.x,y:anchor.y}:{x:anchor.x,y:p.y};
  }
  function validShape(s) {
    const point=p=>p && Number.isFinite(p.x) && Number.isFinite(p.y);
    if(!s) return false;
    if(s.type==="line" || s.type==="rect") return point(s.a)&&point(s.b);
    if(s.type==="circle") return point(s.c)&&Number.isFinite(s.r)&&s.r>0;
    if(s.type==="polygon" || s.type==="polyline") return Array.isArray(s.points)&&s.points.length>=(s.closed?3:2)&&s.points.every(point)&&typeof s.closed==="boolean";
    return false;
  }
  function finishPath(closed=false) {
    if(pathPoints.length<(closed?3:2)) return;
    if(closed) {
      const area=Math.abs(pathPoints.reduce((sum,p,i)=>{const n=pathPoints[(i+1)%pathPoints.length];return sum+p.x*n.y-n.x*p.y;},0))/2;
      const cross=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
      const intersects=(a,b,c,d)=>cross(a,b,c)*cross(a,b,d)<=0 && cross(c,d,a)*cross(c,d,b)<=0 &&
        Math.max(Math.min(a.x,b.x),Math.min(c.x,d.x))<=Math.min(Math.max(a.x,b.x),Math.max(c.x,d.x)) &&
        Math.max(Math.min(a.y,b.y),Math.min(c.y,d.y))<=Math.min(Math.max(a.y,b.y),Math.max(c.y,d.y));
      let invalid=area<.001;
      for(let i=0;i<pathPoints.length;i++) for(let j=i+2;j<pathPoints.length;j++){
        if(i===0 && j===pathPoints.length-1) continue;
        if(intersects(pathPoints[i],pathPoints[(i+1)%pathPoints.length],pathPoints[j],pathPoints[(j+1)%pathPoints.length])) invalid=true;
      }
      if(invalid){if(tool==="quad")pathPoints.pop();setMessage("Fläche ungültig · letzten Eckpunkt erneut setzen");return;}
    }
    remember();
    shapes.push({type:tool==="quad"?"polygon":"polyline",points:clone(pathPoints),closed});
    selected=shapes.length-1;setTool("select");changed();
  }
  document.querySelector("#finishPath").addEventListener("click",()=>{
    if(tool==="polyline") finishPath(false);
    else setMessage("Polylinie mit mindestens zwei Punkten zeichnen.");
  });
  document.querySelector("#ortho").addEventListener("click",event=>{
    ortho=!ortho;event.currentTarget.classList.toggle("active",ortho);
    event.currentTarget.setAttribute("aria-pressed",String(ortho));
    setMessage("Orthogonal "+(ortho?"ein":"aus"));
  });
  const icons={
    select:'<path d="M5 3l14 9-7 1-3 7z"/>',
    line:'<path d="M4 20L20 4"/><circle cx="4" cy="20" r="2"/><circle cx="20" cy="4" r="2"/>',
    polyline:'<path d="M3 19l4-13 9 3 5 11z"/><circle cx="7" cy="6" r="2"/>',
    quad:'<path d="M3 19L6 5l13 3 2 12z"/>',
    rect:'<rect x="4" y="6" width="16" height="12"/>',
    circle:'<circle cx="12" cy="12" r="8"/>',
    pan:'<path d="M12 2v20M2 12h20M8 6l4-4 4 4M8 18l4 4 4-4M6 8l-4 4 4 4M18 8l4 4-4 4"/>',
    ortho:'<path d="M5 3v16h16M5 14h5v5"/>',
    finishPath:'<path d="M4 12l5 5L20 5"/>',
    undo:'<path d="M8 4L3 9l5 5M3 9h10a7 7 0 010 14"/>',
    redo:'<path d="M16 4l5 5-5 5M21 9H11a7 7 0 000 14"/>',
    delete:'<path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7"/>',
    save:'<path d="M4 3h13l3 3v15H4zM8 3v6h8V3M8 21v-7h8v7"/>',
    exportProject:'<path d="M4 3h10l5 5v13H4zM14 3v5h5M11 10v8m-3-3l3 3 3-3"/>',
    importProject:'<path d="M4 3h10l5 5v13H4zM14 3v5h5M11 18v-8m-3 3l3-3 3 3"/>',
    exportSvg:'<path d="M4 4h16v16H4zM4 16l5-6 5 5 3-3 3 4"/><circle cx="16" cy="8" r="1"/>',
    newProject:'<path d="M4 3h10l5 5v13H4zM14 3v5h5M8 14h7M11.5 10.5v7"/>'
  };
  document.querySelectorAll(".toolbar button").forEach(button=>{
    const key=button.dataset.tool||button.id;
    const title=button.textContent.trim();
    button.title=title;button.setAttribute("aria-label",title);
    button.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+icons[key]+'</svg>';
  });

  const saved=localStorage.getItem("baden-cad-project");
  if (saved) {
    try {
      const data=JSON.parse(saved);
      if (Array.isArray(data.shapes) && data.shapes.every(validShape)) shapes=data.shapes;
    } catch {}
  }
  window.addEventListener("resize",resize);
  new ResizeObserver(resize).observe(canvas);
  updateButtons();
  resize();
})();
</script>
</body>
</html>
